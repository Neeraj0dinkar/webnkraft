<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | webnKraft Admin</title>
  <meta name="description" content="Reset your webnKraft administrator password.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6fa;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #172033;
    }

    .card {
      width: min(430px, 100%);
      background: #fff;
      border: 1px solid #e4e7ec;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 16px 40px rgba(16, 24, 40, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #d9dee8;
      font-size: 27px;
      font-weight: 800;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .intro {
      margin: 0 0 24px;
      color: #667085;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d7dce5;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #635bff;
      box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.12);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px 16px;
      border: 0;
      border-radius: 9px;
      background: #635bff;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #067647;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #635bff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="brand">
      <div class="mark">W</div>
      <div class="brand-name">webnKraft Admin</div>
    </div>

    <h1>Set new password</h1>

    <p class="intro">
      Enter a new password for your administrator account.
    </p>

    <form id="resetForm">

      <label for="password">New password</label>

      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm new password</label>

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button id="updateBtn" type="submit">
        Update password
      </button>

      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>

    </form>

    <a class="back" href="index.html">
      Back to Admin Login
    </a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://pcqnjersuxikgygemuef.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_2WqOqYdSooRt8QpRIqkEZA_RfgFSBW8";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const form =
      document.getElementById("resetForm");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const updateBtn =
      document.getElementById("updateBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        `message ${type || ""}`;

    }


    // Listen for the password recovery session
    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          "Auth event:",
          event
        );

        if (event === "PASSWORD_RECOVERY") {

          showMessage(
            "You can now set your new password.",
            "success"
          );

        }

      }
    );


    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        showMessage("", "");

        if (
          password.value !==
          confirmPassword.value
        ) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }

        if (password.value.length < 8) {

          showMessage(
            "Password must be at least 8 characters.",
            "error"
          );

          return;

        }

        updateBtn.disabled = true;

        updateBtn.textContent =
          "Updating password...";


        try {

          const {
            error
          } =
            await supabaseClient.auth.updateUser({
              password: password.value
            });


          if (error) {
            throw error;
          }


          showMessage(
            "Password updated successfully. Redirecting to Admin Login...",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 1800);


        } catch (error) {

          console.error(
            "Password update failed:",
            error
          );

          showMessage(
            error?.message ||
            "Unable to update password. Please request a new reset link.",
            "error"
          );

          updateBtn.disabled = false;

          updateBtn.textContent =
            "Update password";

        }

      }
    );

  </script>

</body>
</html>
