<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webnKraft Admin Login</title>
  <meta name="description" content="webnKraft administrator login.">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f4f6fa; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#172033; }
    .card { width:min(430px,100%); background:#fff; border:1px solid #e4e7ec; border-radius:18px; padding:32px; box-shadow:0 16px 40px rgba(16,24,40,.08); }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .mark { width:46px; height:46px; display:grid; place-items:center; border-radius:12px; background:#fff; border:1px solid #d9dee8; font-size:27px; font-weight:800; }
    .brand-name { font-size:22px; font-weight:800; }
    h1 { margin:0 0 8px; font-size:28px; }
    .intro { margin:0 0 24px; color:#667085; line-height:1.5; }
    label { display:block; margin:16px 0 7px; font-size:13px; font-weight:700; }
    input { width:100%; padding:12px 13px; border:1px solid #d7dce5; border-radius:9px; font-size:15px; outline:none; }
    input:focus { border-color:#635bff; box-shadow:0 0 0 3px rgba(99,91,255,.12); }
    button { width:100%; margin-top:22px; padding:13px 16px; border:0; border-radius:9px; background:#635bff; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.65; cursor:not-allowed; }
    .message { min-height:22px; margin-top:16px; font-size:14px; line-height:1.5; }
    .error { color:#b42318; }
    .success { color:#067647; }
    .note { margin-top:22px; padding-top:18px; border-top:1px solid #eaecf0; color:#667085; font-size:12px; line-height:1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="mark">W</div>
      <div class="brand-name">webnKraft Admin</div>
    </div>

    <h1>Sign in</h1>
    <p class="intro">Access your project enquiries and lead management dashboard.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required value="neeraj0dinkar0@gmail.com">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginBtn" type="submit">Sign in</button>

      <div style="margin-top:14px; text-align:center;">
        <a
          href="#"
          id="forgotPassword"
          style="color:#635bff; text-decoration:none; font-size:14px; font-weight:600;"
        >
          Forgot password?
        </a>
      </div>

      <div id="message" class="message" aria-live="polite"></div>
    </form>

    <div class="note">Administrator access only. Your Supabase account controls authentication; database policies must also restrict enquiry access.</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://pcqnjersuxikgygemuef.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2WqOqYdSooRt8QpRIqkEZA_RfgFSBW8";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");
    const forgotPassword =
      document.getElementById("forgotPassword");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type || ""}`;
    }

    async function checkExistingSession() {
      const { data } = await supabaseClient.auth.getUser();
      if (data?.user) window.location.href = "dashboard.html";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";
      showMessage("", "");

      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: email.value.trim(),
          password: password.value
        });

        if (error) throw error;
        showMessage("Sign-in successful. Opening dashboard...", "success");
        window.location.href = "dashboard.html";
      } catch (error) {
        console.error("Admin login failed:", error);
        showMessage(error?.message || "Unable to sign in. Please check your credentials.", "error");
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign in";
      }
    });
    
    forgotPassword.addEventListener("click", async event => {

      event.preventDefault();

      const userEmail = email.value.trim();

      if (!userEmail) {
        showMessage(
          "Please enter your email address first.",
          "error"
        );
        email.focus();
        return;
      }

      forgotPassword.style.pointerEvents = "none";
      forgotPassword.textContent = "Sending reset link...";

      showMessage("", "");

      try {

        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(
            userEmail,
            {
              redirectTo:
                `${window.location.origin}/admin/reset-password.html`
            }
          );

        if (error) {
          throw error;
        }

        showMessage(
          "Password reset link has been sent to your email. Please check your inbox.",
          "success"
        );

      } catch (error) {

        console.error(
          "Password reset request failed:",
          error
        );

        showMessage(
          error?.message ||
          "Unable to send password reset email.",
          "error"
        );

      } finally {

        forgotPassword.style.pointerEvents = "";
        forgotPassword.textContent = "Forgot password?";

      }

    });

    checkExistingSession();
  </script>
</body>
</html>
