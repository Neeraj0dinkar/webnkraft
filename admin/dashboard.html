<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>webnKraft Admin Dashboard</title>

  <meta
    name="description"
    content="webnKraft project enquiry administration dashboard."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .topbar {
      height: 72px;
      background: #0b1220;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 800;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: white;
      color: #0b1220;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .admin-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-email {
      font-size: 13px;
      color: #b9c2d2;
    }

    .logout-btn {
      border: 1px solid #46516a;
      background: transparent;
      color: white;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #182238;
    }

    .container {
      width: min(1400px, 94%);
      margin: 0 auto;
      padding: 30px 0 50px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }

    .page-header h1 {
      margin: 0 0 7px;
      font-size: 30px;
    }

    .page-header p {
      margin: 0;
      color: #667085;
    }

    .refresh-btn {
      border: 0;
      background: #635bff;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: white;
      border: 1px solid #e3e7ef;
      border-radius: 14px;
      padding: 20px;
    }

    .stat-label {
      color: #667085;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
    }

    .panel {
      background: white;
      border: 1px solid #e3e7ef;
      border-radius: 14px;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px 22px;
      border-bottom: 1px solid #e8ebf1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .search {
      width: 280px;
      max-width: 100%;
      padding: 10px 12px;
      border: 1px solid #d7dce5;
      border-radius: 8px;
      outline: none;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th,
    td {
      padding: 15px 18px;
      text-align: left;
      border-bottom: 1px solid #edf0f4;
      vertical-align: top;
    }

    th {
      background: #fafbfc;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #667085;
    }

    td {
      font-size: 14px;
    }

    .customer-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .customer-email {
      color: #667085;
      font-size: 12px;
    }

    .project-type {
      font-weight: 700;
    }

    .business {
      color: #475467;
      margin-top: 4px;
    }

    .status-select {
      border: 1px solid #d7dce5;
      border-radius: 7px;
      padding: 7px 9px;
      background: white;
      cursor: pointer;
    }

    .save-status {
      display: inline-block;
      margin-left: 7px;
      border: 0;
      background: #172033;
      color: white;
      border-radius: 7px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .view-details {
        display: inline-block;
        margin-left: 7px;
        border: 1px solid #635bff;
        background: white;
        color: #635bff;
        border-radius: 7px;
        padding: 7px 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
    }

    .view-details:hover {
        background: #f2f1ff;
    }

    .features {
      max-width: 260px;
      line-height: 1.5;
      color: #475467;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: #667085;
    }

    .loading {
      padding: 50px 20px;
      text-align: center;
      color: #667085;
    }

    .error {
      margin: 20px;
      padding: 14px;
      background: #fff1f1;
      color: #b42318;
      border: 1px solid #fecdca;
      border-radius: 8px;
    }

    @media (max-width: 800px) {

      .topbar {
        padding: 0 16px;
      }

      .admin-email {
        display: none;
      }

      .container {
        width: 94%;
        padding-top: 22px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .page-header {
        flex-direction: column;
      }

      .panel-header {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        width: 100%;
      }
    }
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(11, 18, 32, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 9999;
    }

    .modal-overlay[hidden] {
        display: none;
    }

    .modal {
        width: min(850px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        background: white;
        border-radius: 16px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
        padding: 22px 24px;
        border-bottom: 1px solid #e8ebf1;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .modal-header h2 {
        margin: 0 0 5px;
        font-size: 22px;
    }

    .modal-header p {
        margin: 0;
        color: #667085;
        font-size: 13px;
    }

    .close-modal {
        border: 0;
        background: #f2f4f7;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        font-size: 24px;
        cursor: pointer;
    }

    .close-modal:hover {
        background: #e4e7ec;
    }

    .detail-body {
        padding: 24px;
    }

    .detail-section {
        margin-bottom: 24px;
    }

    .detail-section h3 {
        margin: 0 0 14px;
        font-size: 15px;
        color: #172033;
    }

    .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }

    .detail-item {
        background: #f8fafc;
        border-radius: 10px;
        padding: 13px 15px;
    }

    .detail-item.full {
        grid-column: 1 / -1;
    }

    .detail-label {
        display: block;
        color: #667085;
        font-size: 12px;
        margin-bottom: 5px;
    }

    .detail-value {
        color: #172033;
        font-size: 14px;
        line-height: 1.5;
    }

    .detail-input,
    .detail-select,
    .detail-textarea {
        width: 100%;
        border: 1px solid #d7dce5;
        border-radius: 8px;
        padding: 10px 11px;
        font-size: 14px;
        background: white;
    }

    .detail-textarea {
        min-height: 100px;
        resize: vertical;
    }

    .modal-actions {
        padding: 18px 24px;
        border-top: 1px solid #e8ebf1;
        display: flex;
        justify-content: flex-end;
    }

    .save-details {
        border: 0;
        background: #635bff;
        color: white;
        border-radius: 9px;
        padding: 11px 20px;
        font-weight: 700;
        cursor: pointer;
    }

    .save-details:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    @media (max-width: 650px) {

        .detail-grid {
            grid-template-columns: 1fr;
        }

        .detail-item.full {
            grid-column: auto;
        }

        .modal-overlay {
            padding: 10px;
        }

        .modal {
            max-height: 95vh;
        }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <div class="brand-mark">W</div>
      <span>webnKraft Admin</span>
    </div>

    <div class="admin-info">

      <span
        class="admin-email"
        id="adminEmail"
      ></span>

      <button
        class="logout-btn"
        id="logoutBtn"
      >
        Sign out
      </button>

    </div>

  </header>


  <main class="container">

    <section class="page-header">

      <div>
        <h1>Project Enquiries</h1>

        <p>
          Manage enquiries submitted through the webnKraft Project Builder.
        </p>
      </div>

      <button
        class="refresh-btn"
        id="refreshBtn"
      >
        Refresh
      </button>

    </section>


    <section class="stats">

      <div class="stat-card">
        <div class="stat-label">Total enquiries</div>
        <div class="stat-number" id="totalCount">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">New</div>
        <div class="stat-number" id="newCount">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Contacted</div>
        <div class="stat-number" id="contactedCount">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Proposal</div>
        <div class="stat-number" id="proposalCount">0</div>
      </div>

    </section>


    <section class="panel">

      <div class="panel-header">

        <h2>Customer enquiries</h2>

        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="Search enquiries..."
        >

      </div>


      <div
        id="dashboardContent"
        class="loading"
      >
        Loading enquiries...
      </div>

    </section>
    <div
        id="detailModal"
        class="modal-overlay"
        hidden
        >

        <div class="modal">

            <div class="modal-header">

            <div>
                <h2>Enquiry Details</h2>
                <p id="detailSubmitted"></p>
            </div>

            <button
                id="closeModal"
                class="close-modal"
                type="button"
            >
                ×
            </button>

            </div>


            <div id="detailContent"></div>


            <div class="modal-actions">

            <button
                id="saveDetails"
                class="save-details"
                type="button"
            >
                Save changes
            </button>

            </div>

        </div>

        </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="dashboard.js"></script>

</body>
</html>
